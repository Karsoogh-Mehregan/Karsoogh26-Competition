[project]
name = "karsoogh26-competition-backend"
version = "0.1.0"
description = "Django REST backend for the Karsoogh 26 competition platform"
readme = "README.md"
authors = [
    { name = "AliAlmasiZ", email = "ali1385almasi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.0",
    "gunicorn>=26.1.0",
    "psycopg[binary]>=3.3.4",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "drf-spectacular>=0.30.0",
    "pytest",
    "pytest-django",
    "ruff",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
ignore = [
    # Django's Meta and ModelAdmin class attributes are mutable lists by design
    # (constraints, indexes, ordering, list_display). Annotating each as ClassVar
    # would be noise on every model in the project.
    "RUF012",
    # Money is always constructed from a string: Decimal("0.10") is exact,
    # Decimal(0.10) is not. Keeping the string form uniform makes the unsafe
    # variant visibly wrong rather than merely inconsistent.
    "FURB157",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "postgres_only: needs real row locks; select_for_update is a silent no-op on SQLite",
]
